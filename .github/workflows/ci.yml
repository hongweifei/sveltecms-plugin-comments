name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 版本矩阵：项目不锁精确版本（devEngines.onFail=ignore），CI 就该验证
    # 多版本组合都成立——锁一个版本跑绿，证明不了别的环境能用。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        pnpm: [12.21.0, 11.28.13]
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # 宿主框架自动 clone 进 .sveltecms/ 并装配（scripts/ensure-host.mjs
      # 由 pnpm test 前置触发）——与本地开发同一条路径
      - name: Install plugin deps
        run: pnpm install --frozen-lockfile
      - name: Unit + SSR render tests (auto-ensures host)
        run: pnpm test

      - name: svelte-check
        run: pnpm check

  e2e:
    # 宿主 dev server 冷启动 + 插件 e2e 全链路（发布 tag 与主干推送跑；
    # PR 可手动触发或去掉 if）
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
